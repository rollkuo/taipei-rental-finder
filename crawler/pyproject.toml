[project]
name = "rental-finder-crawler"
version = "0.1.0"
description = "591 rental scraper feeding Supabase"
requires-python = ">=3.12"
dependencies = [
    "drissionpage>=4.1.0",
    "supabase>=2.20.0",
    "tenacity>=9.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
